[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inscien"
version = "0.4.0"
description = "A local, private citation map over your own Zotero library, served in your browser."
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
# Direct deps: fastapi, uvicorn, SQLAlchemy, requests, python-dotenv, platformdirs. The rest is
# their pinned transitive closure. No ML runtime - the Map is OpenAlex over HTTP.
dependencies = [
    "annotated-doc==0.0.4",
    "annotated-types==0.7.0",
    "anyio==4.13.0",
    "certifi==2026.2.25",
    "charset-normalizer==3.4.7",
    "click==8.3.2",
    "fastapi==0.135.3",
    "greenlet==3.4.0",
    "h11==0.16.0",
    "idna==3.11",
    "platformdirs>=4",
    "pydantic==2.13.0",
    "pydantic_core==2.46.0",
    "python-dotenv==1.2.2",
    "requests==2.33.1",
    "sniffio==1.3.1",
    "SQLAlchemy==2.0.49",
    "starlette==1.0.0",
    "typing-inspection==0.4.2",
    "typing_extensions==4.15.0",
    "urllib3==2.6.3",
    "uvicorn==0.44.0",
]

# GitHub is the project's only public surface (there is no website), so point PyPI at the repo.
[project.urls]
Homepage = "https://github.com/barisarat/inscien"
Source = "https://github.com/barisarat/inscien"
Issues = "https://github.com/barisarat/inscien/issues"

[project.scripts]
inscien = "launcher:main"

# Flat app layout (no top-level `inscien/` package): list exactly what ships in the wheel.
# Installed into an isolated env by uvx/pipx, so top-level modules (main, core, ...) can't collide.
[tool.hatch.build.targets.wheel]
only-include = [
    "launcher.py",
    "main.py",
    "core",
    "models",
    "repositories",
    "routers",
    "schemas",
    "services",
    "webui",
]
